name: Build

# Ověřuje, že se web dá sestavit. Docusaurus má nastavené
# onBrokenLinks: 'throw', takže tenhle build odchytí i rozbité odkazy
# a chybějící obrázky dřív, než se nasadí na Vercel.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Nastavit Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: maturita/package-lock.json

      - name: Nainstalovat závislosti
        working-directory: maturita
        run: npm ci

      - name: Sestavit web
        working-directory: maturita
        run: npm run build
